  <!-- faint architectural line motif -->
  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" fill="none">
    <path d="M60 240 V 120 L 150 60 L 240 120 V 240"/>
    <path d="M900 240 V 96 L 1010 30 L 1120 96 V 240"/>
    <path d="M300 240 L 400 150 L 500 240"/>
    <path d="M700 240 L 800 150 L 900 240"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1" fill="none">
    <circle cx="600" cy="120" r="54"/>
    <circle cx="600" cy="120" r="92"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="600" cy="66" r="2.4"/><circle cx="600" cy="174" r="2.4"/>
    <circle cx="546" cy="120" r="2.4"/><circle cx="654" cy="120" r="2.4"/>
  </g>

  <!-- accent rule -->
  <rect x="0" y="0" width="1200" height="2" fill="#ffffff" fill-opacity="0.85"/>

  <!-- labels -->
  <text x="60" y="206" fill="#ffffff" fill-opacity="0.92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="6" font-weight="600">ZHU1J</text>
  <text x="60" y="228" fill="#ffffff" fill-opacity="0.42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="3">JAVA BACKEND / AI AGENT ENGINEER</text>
  <text x="1140" y="228" text-anchor="end" fill="#ffffff" fill-opacity="0.32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">RUN THE CODE · RUN THE WORLD</text>
</svg>
